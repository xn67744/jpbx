<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - JPBX</title>
    <link rel="shortcut icon" th:href="@{/favicon.ico}"/>
    <link th:href="@{/css/bootstrap.min.css?v=3.3.7}" rel="stylesheet"/>
    <link th:href="@{/css/font-awesome.min.css?v=4.7.0}" rel="stylesheet"/>
    <link th:href="@{/av/css/pbx-theme.css?v=20261119b}" rel="stylesheet"/>
</head>
<body class="pbx-error">
<div class="pbx-error-card">
    <img class="pbx-error-logo" th:src="@{/img/logo/jpbx-logo-512.png}" alt="JPBX"/>
    <div class="pbx-error-code">403</div>
    <h3>没有访问权限</h3>
    <p>当前账号未获授权访问该功能。<br>如确需使用，请联系管理员在「角色管理」中分配对应权限。</p>
    <a href="javascript:index()" class="btn btn-primary"><i class="fa fa-th-large"></i> 返回概览</a>
</div>
<script th:inline="javascript">
    var ctx = [[@{/}]];
    function index() {
        window.top.location = ctx + "index";
    }
</script>
</body>
</html>
