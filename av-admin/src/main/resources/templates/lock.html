<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>锁屏 - JPBX</title>
    <link rel="shortcut icon" th:href="@{/favicon.ico}"/>
    <link th:href="@{/css/bootstrap.min.css?v=3.3.7}" rel="stylesheet"/>
    <link th:href="@{/css/font-awesome.min.css?v=4.7.0}" rel="stylesheet"/>
    <link th:href="@{/av/css/pbx-theme.css?v=20261119b}" rel="stylesheet"/>
</head>
<body class="pbx-lock">
<div class="pbx-lock-card">
    <img th:src="@{/img/logo/jpbx-logo-512.png}" alt="JPBX"/>
    <div class="pbx-lock-brand">JPBX</div>
    <div class="pbx-lock-time"></div>
    <div class="pbx-lock-user">
        <img th:src="(${#strings.isEmpty(user.avatar)}) ? @{/img/profile.jpg} : @{${user.avatar}}" th:onerror="this.src='/img/profile.jpg'" alt="头像"/>
        <span>[[${user.loginName}]] / [[${#strings.defaultString(user.userName, '-')}]]</span>
    </div>
    <form method="post" action="#" onsubmit="return false;">
        <input type="password" name="password" autocomplete="off" class="form-control" placeholder="请输入登录密码解锁"/>
        <button type="button" class="btn btn-primary btn-block" onclick="unlock()"><i class="fa fa-unlock-alt"></i> 解锁</button>
    </form>
    <div class="pbx-lock-foot">
        <a th:href="@{logout}">退出并重新登录</a>
    </div>
</div>
<script th:src="@{/js/jquery.min.js?v=3.6.3}"></script>
<script th:src="@{/ajax/libs/layer/layer.min.js}"></script>
<script th:src="@{/av/js/av-ui.js?v=4.7.8}"></script>
<script th:inline="javascript">
    var ctx = [[@{/}]];

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function tick() {
        var d = new Date();
        $('.pbx-lock-time').text(pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()));
    }

    $(function () {
        tick();
        setInterval(tick, 1000);
        $("input[name='password']").focus();
    });

    $(document).keydown(function (event) {
        if (event.keyCode == 13) {
            unlock();
        }
    });

    function unlock() {
        var password = $("input[name='password']").val();
        if ($.common.isEmpty(password)) {
            $.modal.msg("请输入密码");
            return;
        }
        var index = "";
        $.ajax({
            url: ctx + "unlockscreen",
            type: "post",
            dataType: "json",
            data: { password: password },
            beforeSend: function () {
                index = layer.load(2, { shade: false });
            },
            success: function (result) {
                if (result.code == web_status.SUCCESS) {
                    location.href = ctx + 'index';
                } else {
                    $.modal.msg(result.msg);
                    $("input[name='password']").val("");
                }
                layer.close(index);
            }
        });
    }
</script>
</body>
</html>
