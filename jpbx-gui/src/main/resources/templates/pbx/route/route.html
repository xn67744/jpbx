<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('路由管理列表')" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="pbx:route:add">
                    <i class="fa fa-plus"></i> 添加
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="pbx:route:edit">
                    <i class="fa fa-edit"></i> 修改
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="pbx:route:remove">
                    <i class="fa fa-remove"></i> 删除
                </a>
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="pbx:route:export">
                    <i class="fa fa-download"></i> 导出
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('pbx:route:edit')}]];
        var removeFlag = [[${@permission.hasPermi('pbx:route:remove')}]];
        var typeDatas = [[${@dict.getType('pbx_route_type')}]];
        var inboundModelDatas = [[${@dict.getType('pbx_route_inbound_model')}]];
        var prefix = ctx + "pbx/route";

        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "路由管理",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: '主键',
                    visible: false
                },
                {
                    field: 'name',
                    title: '路由名称',
                    visible: true
                },
                {
                    field: 'reg',
                    title: '匹配前缀',
                    visible: true
                },
                {
                    field: 'type',
                    title: '路由类型',
                    visible: true,
                    formatter: function(value, item, index) {
                        return $.table.selectDictLabel(typeDatas, value);
                    }
                },
                {
                    field: 'inboundModel',
                    title: '呼入模式',
                    visible: true,
                    formatter: function(value, item, index) {
                        return $.table.selectDictLabel(inboundModelDatas, value);
                    }
                },
                {
                    field: 'gatewayId',
                    title: '中继id',
                    visible: false
                },
                {
                    field: 'gatewayNames',
                    title: '中继名称',
                    visible: true
                },
                {
                    field: 'callerPre',
                    title: '新增主叫前缀',
                    visible: true
                },
                {
                    field: 'callerPreRemove',
                    title: '主叫前缀删除位数',
                    visible: true
                },
                {
                    field: 'calleePre',
                    title: '新增被叫前缀',
                    visible: true
                },
                {
                    field: 'calleePreRemove',
                    title: '被叫前缀删除位数',
                    visible: true
                },
                {
                    field: 'did',
                    title: 'DID号码',
                    visible: true
                },
                {
                    field: 'calleeCheck',
                    title: '被叫检测',
                    visible: false
                },
                {
                    field: 'transform',
                    title: '呼出主叫转换号码',
                    visible: true
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>删除</a>');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });
    </script>
</body>
</html>
