<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:include="include :: header('修改分机组')" /></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
<form class="form-horizontal m" id="form-edit" th:object="${row}">
  <input name="id" th:field="*{id}" type="hidden">
  <div class="form-group">
    <label class="col-sm-3 control-label is-required">名称：</label>
    <div class="col-sm-8">
      <input name="name" th:field="*{name}" class="form-control" required>
      <span class="help-block m-b-none">分组名会写进 directory XML 的 <code>&lt;group name="..."&gt;</code></span>
    </div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">所属域名：</label>
    <div class="col-sm-8">
      <select name="domain" class="form-control" th:field="*{domain}">
        <option value="">默认/不限定</option>
        <option th:each="d : ${domains}" th:value="${d.name}" th:text="${d.name}"></option>
      </select>
      <span class="help-block m-b-none">为空时该分组会出现在所有域名下</span>
    </div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">成员分机：</label>
    <div class="col-sm-8">
      <select id="memberSelect" class="form-control" multiple size="8">
        <option th:each="u : ${users}" th:value="${u.number}"
                th:text="${u.name != null and u.name != '' ? u.number + ' - ' + u.name : u.number}"></option>
      </select>
      <input type="hidden" name="memberIds" id="memberIds">
      <span class="help-block m-b-none">按住 Ctrl 多选；成员会以 <code>&lt;user type="pointer"&gt;</code> 形式写进该分组</span>
    </div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">备注：</label>
    <div class="col-sm-8"><input name="remark" th:field="*{remark}" class="form-control"></div>
  </div>
</form>
</div>
<th:block th:include="include :: footer" />
<script th:inline="javascript">
var prefix = ctx + "pbx/group";
var selectedMembers = /*[[${row.memberNumbers}]]*/ [];
</script>
<script>
function syncMembers() {
  var vals = $('#memberSelect').val() || [];
  $('#memberIds').val(vals.join(','));
}

$(function() {
  if (selectedMembers && selectedMembers.length) {
    $('#memberSelect').val(selectedMembers);
  }
  syncMembers();
  $('#memberSelect').on('change', syncMembers);
});

$("#form-edit").validate({focusCleanup:true});
function submitHandler(){ syncMembers(); if($.validate.form()){ $.operate.save(prefix+"/edit", $('#form-edit').serialize()); } }
</script>
</body></html>
