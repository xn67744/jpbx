<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:include="include :: header('新增会议室')" /></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
<form class="form-horizontal m" id="form-add">
  <div class="form-group"><label class="col-sm-3 control-label is-required">会议室号：</label><div class="col-sm-8"><input name="name" class="form-control" placeholder="3000" required></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">Profile：</label><div class="col-sm-8"><input name="profile" class="form-control" value="default"></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">PIN：</label><div class="col-sm-8"><input name="pin" class="form-control"></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">最大人数：</label><div class="col-sm-8"><input name="maxMembers" class="form-control" type="number" value="50"></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">启用：</label><div class="col-sm-8"><select name="enabled" class="form-control"><option value="1">是</option><option value="0">否</option></select></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">备注：</label><div class="col-sm-8"><input name="remark" class="form-control"></div></div>
</form>
</div>
<th:block th:include="include :: footer" />
<script>
var prefix = ctx + "pbx/conference";
$("#form-add").validate({focusCleanup:true});
function submitHandler(){ if($.validate.form()){ $.operate.save(prefix+"/add", $('#form-add').serialize()); } }
</script>
</body></html>
