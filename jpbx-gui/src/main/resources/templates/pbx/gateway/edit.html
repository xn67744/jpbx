<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改呼叫中继')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-gateway-edit" th:object="${tPbxGateway}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">
                <label class="col-sm-3 control-label">中继名称：</label>
                <div class="col-sm-9">
                    <input type="text" name="name"  class="form-control" placeholder="请输入文本" th:field="*{name}">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">服务器地址：</label>
                <div class="col-sm-9">
                    <input type="text" name="realm"  class="form-control" placeholder="请输入文本" th:field="*{realm}">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">中继类型：</label>
                <div class="col-sm-9">
                    <select name="type" class="form-control m-b" th:with="type=${@dict.getType('pbx_gateway_type')}">
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{type}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">传输类型：</label>
                <div class="col-sm-9">
                    <select name="transport" class="form-control m-b" th:with="type=${@dict.getType('pbx_gateway_translate_type')}">
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{transport}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">账户：</label>
                <div class="col-sm-9">
                    <input type="text" name="username" class="form-control" placeholder="请输入文本" th:value="*{username}">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">密码：</label>
                <div class="col-sm-9">
                    <input type="text" name="password"  class="form-control" placeholder="请输入文本" th:value="*{password}">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">注册间隔：</label>
                <div class="col-sm-9">
                <input type="text" name="retrySeconds"  class="form-control" placeholder="请输入数字" th:value="*{retrySeconds}">
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "pbx/gateway";
        $("#form-gateway-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-gateway-edit').serialize());
            }
        }
    </script>
</body>
</html>
