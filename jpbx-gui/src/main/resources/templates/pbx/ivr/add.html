<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:include="include :: header('新增IVR')" /></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
<form class="form-horizontal m" id="form-add">
  <div class="form-group"><label class="col-sm-3 control-label is-required">名称：</label><div class="col-sm-8"><input name="name" class="form-control" required></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">长欢迎音：</label><div class="col-sm-8"><input name="greetLong" class="form-control" placeholder="ivr/ivr-welcome.wav" value="ivr/ivr-welcome.wav"></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">短欢迎音：</label><div class="col-sm-8"><input name="greetShort" class="form-control" placeholder="ivr/ivr-welcome.wav"></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">超时(ms)：</label><div class="col-sm-8"><input name="timeout" class="form-control" type="number" value="10000"></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">最大失败：</label><div class="col-sm-8"><input name="maxFailures" class="form-control" type="number" value="3"></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">启用：</label><div class="col-sm-8"><select name="enabled" class="form-control"><option value="1">是</option><option value="0">否</option></select></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">备注：</label><div class="col-sm-8"><input name="remark" class="form-control"></div></div>
  <p class="text-muted" style="padding-left:15px;">按键动作可通过 API <code>/pbx/ivr</code> 保存 entries（digits/action/param），或在库表 t_pbx_ivr_entry 维护。拨号计划中拨 <code>ivr_名称</code> 进入本菜单。</p>
</form>
</div>
<th:block th:include="include :: footer" />
<script>
var prefix = ctx + "pbx/ivr";
$("#form-add").validate({focusCleanup:true});
function submitHandler(){ if($.validate.form()){ $.operate.save(prefix+"/add", $('#form-add').serialize()); } }
</script>
</body></html>
