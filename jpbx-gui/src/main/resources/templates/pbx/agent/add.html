<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:include="include :: header('新增坐席')" /></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
<form class="form-horizontal m" id="form-add">
  <div class="form-group"><label class="col-sm-3 control-label is-required">坐席名：</label><div class="col-sm-8"><input name="name" class="form-control" required></div></div>
  <div class="form-group"><label class="col-sm-3 control-label is-required">Contact：</label><div class="col-sm-8"><input name="contact" class="form-control" placeholder="user/1001" required></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">类型：</label><div class="col-sm-8"><select name="type" class="form-control"><option value="callback">callback</option><option value="uuid-standby">uuid-standby</option></select></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">状态：</label><div class="col-sm-8"><select name="status" class="form-control"><option>Logged Out</option><option>Available</option><option>Available (On Demand)</option><option>On Break</option></select></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">启用：</label><div class="col-sm-8"><select name="enabled" class="form-control"><option value="1">是</option><option value="0">否</option></select></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">备注：</label><div class="col-sm-8"><input name="remark" class="form-control"></div></div>
</form>
</div>
<th:block th:include="include :: footer" />
<script>
var prefix = ctx + "pbx/agent";
$("#form-add").validate({focusCleanup:true});
function submitHandler(){ if($.validate.form()){ $.operate.save(prefix+"/add", $('#form-add').serialize()); } }
</script>
</body></html>
