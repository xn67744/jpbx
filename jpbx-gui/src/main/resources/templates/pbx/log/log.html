<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
	<th:block th:include="include :: header('日志查看')" />
	<head>
		<meta charset="UTF-8">
		<title>占满剩余高度的Textarea</title>
		<style>

		</style>
	</head>
</head>
<body class="gray-bg">
<div class="container-div">
	<div class="row">
		<div class="col-sm-12 search-collapse">
			<form id="gen-form">
				<div class="select-list">
					<ul>
						<li class="select-time">
							<label>日志时间： </label>
							<input type="text" class="time-input" id="startTime" placeholder="开始时间" name="params[beginTime]"/>
							<span>-</span>
							<input type="text" class="time-input" id="endTime" placeholder="结束时间" name="params[endTime]"/>
						</li>
						<li>
							<a class="btn btn-primary btn-rounded btn-sm" onclick="watch()"><i class="fa fa-search"></i>&nbsp;查看日志</a>
							<a class="btn btn-warning btn-rounded btn-sm" onclick="watchCurrent()"><i class="fa fa-refresh"></i>&nbsp;查看当前日志</a>
							<a class="btn btn-default btn-rounded btn-sm" onclick="clearScreen()"><i class="fa fa-eraser"></i>&nbsp;清屏</a>
						</li>
					</ul>
				</div>
			</form>
		</div>
		&nbsp;
		<div class="col-sm-12">
			<div class="col-sm-12" id="content" style="overflow-y:auto;max-height:calc(100vh - 220px);" />
		</div>
	</div>
</div>
<th:block th:include="include :: footer" />
<script th:src="@{/ajax/libs/highlight/highlight.min.js}"></script>
<script th:inline="javascript">
		var prefix = ctx + "pbx/log";
		$(function() {
			watch();
		});
		function watch(){
		    $.ajax({
                url: prefix + "/watchLog?beginDate="+$("#startTime").val()+"&endDate="+$("#endTime").val(),
                method: 'GET',
                success: function (data) {
                    $("#content").html(data);
                    scrollLogBottom();
                },
                error: function(){
                	alert('日志获取失败!')
                }
            })
		}
		function watchCurrent(){
		    $("#startTime").val("");
    		$("#endTime").val("");
		    $.ajax({
                url: prefix + "/watchLog",
                method: 'GET',
                success: function (data) {
                    $("#content").html(data);
                    scrollLogBottom();
                },
                error: function(){
                	alert('日志获取失败!')
                }
            })
		}
		/** 日志按时间正序返回，加载后直接定位到最新的行 */
		function scrollLogBottom(){
		    var el = $("#content");
		    if (el.length) { el.scrollTop(el[0].scrollHeight); }
		}
		/** 清屏只清浏览器里的显示，不动 FS 日志文件 */
		function clearScreen(){
		    $("#content").html('<div style="color:#8FA3BD;padding:10px;">已清屏。点「查看当前日志」可重新加载最新 1000 行。</div>');
		}
</script>
</body>
</html>
