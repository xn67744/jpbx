<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:include="include :: header('新增拨号计划')" /></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
<form class="form-horizontal m" id="form-add">
  <div class="form-group">
    <label class="col-sm-3 control-label is-required">名称：</label>
    <div class="col-sm-8"><input name="name" class="form-control" required></div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label is-required">上下文：</label>
    <div class="col-sm-8">
      <select name="context" class="form-control">
        <option value="default">default</option>
        <option value="public">public</option>
        <option value="features">features</option>
      </select>
    </div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">条件字段：</label>
    <div class="col-sm-8"><input name="conditionField" class="form-control" value="destination_number"></div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label is-required">匹配表达式：</label>
    <div class="col-sm-8"><input name="conditionExpr" class="form-control" placeholder="如 ^9(\\d+)$" required></div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">排序：</label>
    <div class="col-sm-8"><input name="sortOrder" class="form-control" type="number" value="100"></div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">启用：</label>
    <div class="col-sm-8">
      <select name="enabled" class="form-control"><option value="1">是</option><option value="0">否</option></select>
    </div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">备注：</label>
    <div class="col-sm-8"><input name="remark" class="form-control"></div>
  </div>
  <div class="hr-line-dashed"></div>
  <p class="text-muted" style="padding-left:20px;">动作可在保存后通过「拨号计划动作」表维护，或使用旧版「路由管理」自动生成 bridge。常用动作示例：answer / sleep / bridge / transfer / ivr / callcenter / conference / voicemail</p>
</form>
</div>
<th:block th:include="include :: footer" />
<script>
var prefix = ctx + "pbx/dialplan";
$("#form-add").validate({focusCleanup:true});
function submitHandler(){ if($.validate.form()){ $.operate.save(prefix+"/add", $('#form-add').serialize()); } }
</script>
</body></html>
