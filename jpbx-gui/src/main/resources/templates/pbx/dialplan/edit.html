<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:include="include :: header('修改拨号计划')" /></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
<form class="form-horizontal m" id="form-edit" th:object="${row}">
  <input name="id" th:field="*{id}" type="hidden">
  <div class="form-group">
    <label class="col-sm-3 control-label is-required">名称：</label>
    <div class="col-sm-8"><input name="name" th:field="*{name}" class="form-control" required></div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label is-required">上下文：</label>
    <div class="col-sm-8"><input name="context" th:field="*{context}" class="form-control" required></div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">条件字段：</label>
    <div class="col-sm-8"><input name="conditionField" th:field="*{conditionField}" class="form-control"></div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label is-required">匹配表达式：</label>
    <div class="col-sm-8"><input name="conditionExpr" th:field="*{conditionExpr}" class="form-control" required></div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">排序：</label>
    <div class="col-sm-8"><input name="sortOrder" th:field="*{sortOrder}" class="form-control" type="number"></div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">启用：</label>
    <div class="col-sm-8"><input name="enabled" th:field="*{enabled}" class="form-control"></div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">备注：</label>
    <div class="col-sm-8"><input name="remark" th:field="*{remark}" class="form-control"></div>
  </div>
</form>
</div>
<th:block th:include="include :: footer" />
<script>
var prefix = ctx + "pbx/dialplan";
$("#form-edit").validate({focusCleanup:true});
function submitHandler(){ if($.validate.form()){ $.operate.save(prefix+"/edit", $('#form-edit').serialize()); } }
</script>
</body></html>
