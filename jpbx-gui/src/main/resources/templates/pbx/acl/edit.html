<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:include="include :: header('修改ACL')" /></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
<form class="form-horizontal m" id="form-edit" th:object="${row}">
  <input name="id" th:field="*{id}" type="hidden">
  <div class="form-group">
    <label class="col-sm-3 control-label is-required">名称：</label>
    <div class="col-sm-8"><input name="name" th:field="*{name}" class="form-control" required></div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">默认策略：</label>
    <div class="col-sm-8">
      <select name="defaultType" class="form-control" th:field="*{defaultType}">
        <option value="deny">deny（不在名单内拒绝）</option>
        <option value="allow">allow（不在名单内放行）</option>
      </select>
    </div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">网段：</label>
    <div class="col-sm-8">
      <textarea name="cidrs" class="form-control" rows="6" th:text="${cidrsText}"
                placeholder="一行一个，例如：&#10;allow 192.168.1.0/24&#10;deny 0.0.0.0/0"></textarea>
      <span class="help-block m-b-none">格式：<code>allow|deny CIDR</code>，省略前缀默认 allow</span>
    </div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">备注：</label>
    <div class="col-sm-8"><input name="remark" th:field="*{remark}" class="form-control"></div>
  </div>
</form>
</div>
<th:block th:include="include :: footer" />
<script>
var prefix = ctx + "pbx/acl";
$("#form-edit").validate({focusCleanup:true});
function submitHandler(){ if($.validate.form()){ $.operate.save(prefix+"/edit", $('#form-edit').serialize()); } }
</script>
</body></html>
