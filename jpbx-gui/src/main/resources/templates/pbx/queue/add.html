<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:include="include :: header('新增队列')" /></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
<form class="form-horizontal m" id="form-add">
  <div class="form-group"><label class="col-sm-3 control-label is-required">队列名：</label><div class="col-sm-8"><input name="name" class="form-control" required></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">策略：</label>
    <div class="col-sm-8">
      <select name="strategy" class="form-control">
        <option value="longest-idle-agent">longest-idle-agent</option>
        <option value="round-robin">round-robin</option>
        <option value="top-down">top-down</option>
        <option value="agent-with-least-talk-time">agent-with-least-talk-time</option>
        <option value="agent-with-fewest-calls">agent-with-fewest-calls</option>
        <option value="sequentially-by-agent-order">sequentially-by-agent-order</option>
        <option value="random">random</option>
        <option value="ring-all">ring-all</option>
      </select>
    </div>
  </div>
  <div class="form-group"><label class="col-sm-3 control-label">等待音乐：</label><div class="col-sm-8"><input name="mohSound" class="form-control" placeholder="$${hold_music}" value="$${hold_music}"></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">最大等待(秒)：</label><div class="col-sm-8"><input name="maxWaitTime" class="form-control" type="number" value="0"></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">启用：</label><div class="col-sm-8"><select name="enabled" class="form-control"><option value="1">是</option><option value="0">否</option></select></div></div>
  <div class="form-group"><label class="col-sm-3 control-label">备注：</label><div class="col-sm-8"><input name="remark" class="form-control"></div></div>
</form>
</div>
<th:block th:include="include :: footer" />
<script>
var prefix = ctx + "pbx/queue";
$("#form-add").validate({focusCleanup:true});
function submitHandler(){ if($.validate.form()){ $.operate.save(prefix+"/add", $('#form-add').serialize()); } }
</script>
</body></html>
