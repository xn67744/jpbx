<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:include="include :: header('新增SIP域名')" /></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
<form class="form-horizontal m" id="form-add">
  <div class="form-group">
    <label class="col-sm-3 control-label is-required">域名：</label>
    <div class="col-sm-8">
      <input name="name" class="form-control" placeholder="如 192.168.0.118 或 pbx.example.com" required>
      <span class="help-block m-b-none">对应 directory XML 中 <code>&lt;domain name="..."&gt;</code>，需与分机注册时使用的域一致</span>
    </div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">解析（parse）：</label>
    <div class="col-sm-8">
      <select name="parse" class="form-control">
        <option value="1" selected>是：按该域名解析分机</option>
        <option value="0">否：只作为别名域出现</option>
      </select>
      <span class="help-block m-b-none">关闭后 FreeSWITCH 不会为该域加载用户，已注册分机可能鉴权失败</span>
    </div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">别名（alias）：</label>
    <div class="col-sm-8">
      <select name="alias" class="form-control">
        <option value="0" selected>否</option>
        <option value="1">是：接受该域的别名匹配</option>
      </select>
    </div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">状态：</label>
    <div class="col-sm-8">
      <select name="enabled" class="form-control">
        <option value="1" selected>启用</option>
        <option value="0">停用</option>
      </select>
      <span class="help-block m-b-none">停用的域名不会出现在 xml_curl 返回的 directory 中</span>
    </div>
  </div>
  <div class="form-group">
    <label class="col-sm-3 control-label">备注：</label>
    <div class="col-sm-8"><input name="remark" class="form-control"></div>
  </div>
</form>
</div>
<th:block th:include="include :: footer" />
<script>
var prefix = ctx + "pbx/domain";
$("#form-add").validate({focusCleanup:true});
function submitHandler(){ if($.validate.form()){ $.operate.save(prefix+"/add", $('#form-add').serialize()); } }
</script>
</body></html>
