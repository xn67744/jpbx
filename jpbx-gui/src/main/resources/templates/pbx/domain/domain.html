<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head><th:block th:include="include :: header('SIP域名列表')" /></head>
<body class="gray-bg">
<div class="container-div">
  <div class="row">
    <div class="btn-group-sm" id="toolbar" role="group">
      <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="pbx:domain:add"><i class="fa fa-plus"></i> 添加</a>
      <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="pbx:domain:edit"><i class="fa fa-edit"></i> 修改</a>
      <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="pbx:domain:remove"><i class="fa fa-remove"></i> 删除</a>
    </div>
    <div class="col-sm-12 select-table table-striped"><table id="bootstrap-table"></table></div>
  </div>
</div>
<th:block th:include="include :: footer" />
<script th:inline="javascript">
var prefix = ctx + "pbx/domain";
var editFlag = [[${@permission.hasPermi('pbx:domain:edit')}]];
var removeFlag = [[${@permission.hasPermi('pbx:domain:remove')}]];

function operateFormatter(value, row, index) {
  var actions = [];
  actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>编辑</a> ');
  actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>删除</a>');
  return actions.join('');
}

$(function() {
  $.table.init({
    url: prefix + "/list",
    createUrl: prefix + "/add",
    updateUrl: prefix + "/edit/{id}",
    removeUrl: prefix + "/remove",
    modalName: "SIP域名",
    columns: [
      {checkbox: true},
      {field: 'id', visible: false},
      {field: 'name', title: '域名'},
      {field: 'parse', title: '解析', formatter: function(v){ return (v === 0) ? '否' : '是'; }},
      {field: 'alias', title: '别名', formatter: function(v){ return (v === 1) ? '是' : '否'; }},
      {field: 'enabled', title: '状态', formatter: function(v){ return (v === 0) ? '停用' : '启用'; }},
      {field: 'remark', title: '备注'},
      {title: '操作', align: 'center', formatter: operateFormatter}
    ]
  });
});
</script>
</body></html>
