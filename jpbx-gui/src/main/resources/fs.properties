# FreeSWITCH ESL / xml_curl 对接配置
tcpPort: 9005
eslHost: 127.0.0.1
eslInBoundPort: 8021
eslOutBoundPort: 18084
eslpwd: ClueCon
connTimeout: 30
# 是否启动 outbound ESL（默认关闭，业务走 xml_curl dialplan）
eslOutboundEnabled: false
# xml_curl 安全：共享口令与来源 IP 白名单（逗号分隔，空=不校验）
xmlCurlToken: jpbx-xml-curl-token
xmlCurlAllowedIps:
